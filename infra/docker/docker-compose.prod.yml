services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      HOMEMONITOR_HOST: ${HOMEMONITOR_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    depends_on:
      - api

  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      AGENT_TOKEN: ${AGENT_TOKEN:?AGENT_TOKEN is required}
      DATABASE_URL: postgres://homemonitor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/homemonitor
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      - timescaledb
      - redis

  worker:
    image: ${API_IMAGE:?API_IMAGE is required}
    restart: unless-stopped
    command: ["npm", "--workspace", "@homemonitor/api", "run", "worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://homemonitor:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@timescaledb:5432/homemonitor
    depends_on:
      - timescaledb

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: homemonitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: homemonitor
    volumes:
      - timescale_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  caddy_data:
  caddy_config:
  timescale_data:
  redis_data:
