name: Build and Deploy

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: cr.yandex/${{ secrets.YC_REGISTRY_ID }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run test

      - name: Login to Yandex Container Registry
        uses: docker/login-action@v3
        with:
          registry: cr.yandex
          username: json_key
          password: ${{ secrets.YC_SA_JSON_KEY }}

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/homemonitor-api:${{ env.IMAGE_TAG }}

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/web.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/homemonitor-web:${{ env.IMAGE_TAG }}

  deploy-vm:
    runs-on: ubuntu-latest
    needs: build-images
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Upload compose files
        run: |
          remote_user="${DEPLOY_USER:-ubuntu}"
          ssh "$remote_user@$DEPLOY_HOST" "mkdir -p /opt/homemonitor/infra/docker"
          scp infra/docker/Caddyfile infra/docker/docker-compose.prod.yml "$remote_user@$DEPLOY_HOST:/opt/homemonitor/infra/docker/"

      - name: Deploy
        run: |
          remote_user="${DEPLOY_USER:-ubuntu}"
          ssh "$remote_user@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/homemonitor
          cat > .env <<ENV
          HOMEMONITOR_HOST=${{ secrets.HOMEMONITOR_HOST || 'localhost' }}
          WEB_ORIGIN=${{ secrets.WEB_ORIGIN || 'http://localhost' }}
          SESSION_SECRET=${{ secrets.SESSION_SECRET }}
          AGENT_TOKEN=${{ secrets.AGENT_TOKEN }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          API_IMAGE=${{ env.REGISTRY }}/homemonitor-api:${{ env.IMAGE_TAG }}
          WEB_IMAGE=${{ env.REGISTRY }}/homemonitor-web:${{ env.IMAGE_TAG }}
          ENV
          docker login cr.yandex -u json_key -p '${{ secrets.YC_SA_JSON_KEY }}'
          docker compose -f infra/docker/docker-compose.prod.yml pull
          docker compose -f infra/docker/docker-compose.prod.yml up -d
          REMOTE
